<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Mufti — Coming Soon</title>
        <meta
            name="description"
            content="Mufti is on the way. Contact us at info@mufti.money."
        />

        <style>
            :root {
                --mufti-dark: #231f20;
                --mufti-light: #f5f2ed;
                --mufti-muted: rgba(245, 242, 237, 0.6);
                --mufti-border: rgba(245, 242, 237, 0.18);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                width: 100%;
                min-height: 100%;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;

                background: var(--mufti-dark);
                color: var(--mufti-light);

                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Helvetica,
                    Arial,
                    sans-serif;

                -webkit-font-smoothing: antialiased;
            }

            .page {
                display: flex;
                flex-direction: column;

                min-height: 100vh;
                min-height: 100dvh;

                padding: 32px 40px;
            }

            /* ================================
       HEADER
    ================================= */

            .header {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .logo {
                color: var(--mufti-light);

                font-size: 22px;
                font-weight: 600;
                letter-spacing: -0.04em;

                text-decoration: none;
            }

            /* ================================
       MAIN
    ================================= */

            .main {
                display: flex;
                flex: 1;
                align-items: center;
            }

            .content {
                width: 100%;
                max-width: 900px;

                padding: 80px 0;
            }

            .eyebrow {
                margin: 0 0 24px;

                color: var(--mufti-muted);

                font-size: 13px;
                font-weight: 500;

                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            h1 {
                max-width: 850px;

                margin: 0;

                font-size: clamp(52px, 8vw, 110px);
                font-weight: 400;

                line-height: 0.95;
                letter-spacing: -0.065em;
            }

            .description {
                max-width: 520px;

                margin: 40px 0 0;

                color: var(--mufti-muted);

                font-size: clamp(17px, 2vw, 20px);
                line-height: 1.6;
            }

            .contact {
                display: inline-block;

                margin-top: 32px;
                padding-bottom: 5px;

                border-bottom: 1px solid var(--mufti-border);

                color: var(--mufti-light);

                font-size: 17px;
                font-weight: 500;

                text-decoration: none;

                transition:
                    opacity 0.2s ease,
                    border-color 0.2s ease;
            }

            .contact:hover {
                opacity: 0.65;
                border-color: var(--mufti-light);
            }

            /* ================================
       FOOTER
    ================================= */

            .footer {
                display: flex;
                align-items: center;
                justify-content: space-between;

                padding-top: 24px;

                border-top: 1px solid var(--mufti-border);

                color: var(--mufti-muted);

                font-size: 12px;
            }

            /* ================================
       MOBILE
    ================================= */

            @media (max-width: 700px) {
                .page {
                    padding: 24px;
                }

                .content {
                    padding: 60px 0;
                }

                h1 {
                    font-size: clamp(54px, 16vw, 78px);
                }

                .description {
                    margin-top: 32px;
                }

                .footer {
                    align-items: flex-start;
                    gap: 12px;
                    flex-direction: column;
                }
            }
        </style>
    </head>

    <body>
        <div class="page">
            <header class="header">
                <a href="/" class="logo">mufti</a>
            </header>

            <main class="main">
                <div class="content">
                    <p class="eyebrow">Coming soon</p>

                    <h1>
                        Something new<br />
                        is on the way.
                    </h1>

                    <p class="description">
                        We're building Mufti. Our new website is currently in
                        the works and will be available soon.
                    </p>

                    <a class="contact" href="mailto:info@mufti.money">
                        info@mufti.money
                    </a>
                </div>
            </main>

            <footer class="footer">
                <span>© 2026 Mufti</span>
                <span>Nairobi, Kenya</span>
            </footer>
        </div>
    </body>
</html>
